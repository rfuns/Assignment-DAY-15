<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Member - SockStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="flex min-h-screen items-center justify-center bg-slate-50 px-4 text-slate-800 antialiased"
  >
    <div class="w-full max-w-md">
      <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
        <!-- Logo -->
        <div class="mb-6 flex flex-col items-center gap-3 text-center">
          <img
            src="../assets/LogoSockStore.png"
            alt="logo SockStore"
            class="h-10 w-auto"
          />
          <div>
            <h1 class="text-xl font-bold tracking-tight text-slate-900">
              Daftar Member SockStore
            </h1>
            <p class="mt-1 text-sm text-slate-500">
              Daftar sebagai member dan dapatkan diskon 10% untuk setiap
              pembelian.
            </p>
          </div>
        </div>

        <form id="memberForm" class="space-y-4" novalidate>
          <div>
            <label
              for="nameInput"
              class="mb-1 block text-sm font-medium text-slate-700"
            >
              Nama Lengkap
            </label>
            <input
              id="nameInput"
              type="text"
              placeholder="Nama kamu"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-900/10"
            />
            <p
              id="nameError"
              class="mt-1 hidden text-xs font-medium text-red-600"
            >
              Nama tidak boleh kosong
            </p>
          </div>

          <div>
            <label
              for="emailInput"
              class="mb-1 block text-sm font-medium text-slate-700"
            >
              Email
            </label>
            <input
              id="emailInput"
              type="email"
              placeholder="nama@email.com"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-900/10"
            />
            <p
              id="emailError"
              class="mt-1 hidden text-xs font-medium text-red-600"
            >
              Format email tidak sesuai
            </p>
          </div>

          <div>
            <label
              for="passwordInput"
              class="mb-1 block text-sm font-medium text-slate-700"
            >
              Password
            </label>
            <input
              id="passwordInput"
              type="password"
              placeholder="Minimal 6 karakter"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-900/10"
            />
            <p
              id="passwordError"
              class="mt-1 hidden text-xs font-medium text-red-600"
            >
              Password minimal 6 karakter
            </p>
          </div>

          <button
            type="submit"
            class="mt-2 w-full rounded-xl bg-slate-900 px-4 py-3 text-sm font-semibold text-white transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-900/30"
          >
            Daftar
          </button>
        </form>

        <p class="mt-4 text-center text-xs text-slate-400">
          Dengan mendaftar, kamu otomatis menjadi member dan mendapat diskon
          10%.
        </p>

        <button
          type="button"
          id="skipBtn"
          class="mt-3 block w-full rounded-xl border border-slate-300 px-4 py-2.5 text-center text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
        >
          Lewati, lanjut tanpa jadi member
        </button>
      </div>
    </div>

    <script src="../Tugas 3/ProsesDaftar.js"></script>
  </body>
</html>
